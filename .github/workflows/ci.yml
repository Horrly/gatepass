name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gatepass
          POSTGRES_USER: gatepass
          POSTGRES_PASSWORD: gatepass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gatepass"
          --health-interval 5s
          --health-retries 10
    env:
      # Postgres (not SQLite) so the concurrent-checkout test exercises real row locks.
      DATABASE_URL: postgres://gatepass:gatepass@localhost:5432/gatepass
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
