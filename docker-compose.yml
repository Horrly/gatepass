services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatepass
      POSTGRES_USER: gatepass
      POSTGRES_PASSWORD: gatepass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatepass"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  backend: &backend
    build: ./backend
    environment: &env
      DATABASE_URL: postgres://gatepass:gatepass@db:5432/gatepass
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      FRONTEND_URL: http://localhost:5173
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    <<: *backend
    command: celery -A config worker --beat --loglevel info
    ports: []
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
