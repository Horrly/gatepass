# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service (Django + a Celery worker, see start.sh).
# Postgres lives on Neon: paste its connection string for DATABASE_URL.
# Redis (Celery's broker): Render allows one free Key Value instance per account,
# so paste the Internal URL of an existing one for REDIS_URL (it can be shared
# with another app), or leave it empty to run background tasks inline.

services:
  - type: web
    name: gatepass
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # your Neon connection string
      - key: PAYSTACK_SECRET_KEY
        sync: false # sk_test_... from Paystack; leave empty to use the payment simulator
      - key: REDIS_URL
        sync: false # Internal URL of a Render Key Value instance, e.g. redis://red-xxxx:6379/1
